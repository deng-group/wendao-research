[project]
title = "{{TITLE}}"
description = "What this graph is about, in a sentence."

[model]
# provider = "claude-code": answers run through Claude Code, with your own Claude Code sign-in (`claude` CLI,
#   claude.ai subscription); no API key. Leave `name` unset to use Claude Code's default model.
# provider = "anthropic": the Messages API with an API key in .env (ANTHROPIC_API_KEY), billed per token.
provider = "claude-code"
# name = "claude-opus-5-5"
# ignore_anthropic_env = true   # claude-code: ignore ANTHROPIC_BASE_URL / _AUTH_TOKEN / _MODEL from your shell
#                               # (e.g. a relay to another model) and use the Claude Code sign-in itself
effort = "medium"      # low | medium | high | xhigh | max: how hard the model thinks per answer
max_tokens = 16000
# fallbacks = false    # Anthropic's server-side refusal fallback (beta)

[agent]
web_search = true          # Anthropic's web search and web fetch tools
literature_search = true   # Semantic Scholar, Crossref and arXiv lookups (no key needed)
auto_apply = false         # true: the model's additions go straight in as confirmed, no review

[server]
host = "127.0.0.1"
port = 5058
