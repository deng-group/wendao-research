[project]
name = "litgraph"
version = "0.1.0"
description = "A research knowledge graph that grows as you read, search and chat, with a Claude research agent"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.15,<2",
    "claude-agent-sdk>=0.2,<1",
    "flask>=3.0,<4",
]

[project.scripts]
litgraph = "litgraph.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
litgraph = ["static/*", "starter/*"]
